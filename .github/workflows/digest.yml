name: Daily arXiv digest

on:
  schedule:
    # arXiv posts at 20:00 ET Sun-Thu; the RSS feed refreshes around midnight ET.
    # Three attempts per weekday morning (UTC times). Each run is a no-op if today's
    # digest already exists or the feed hasn't updated yet.
    - cron: "20 5 * * 1-5"    # ~1:20 AM EDT / 12:20 AM EST
    - cron: "20 9 * * 1-5"    # ~5:20 AM EDT
    - cron: "50 11 * * 1-5"   # ~7:50 AM EDT (last chance)
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild today's digest even if it exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python run.py ${{ inputs.force && '--force' || '' }}
      - name: Commit
        run: |
          git config user.name "arxiv-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Digest $(date -u +%F)"
          git push
