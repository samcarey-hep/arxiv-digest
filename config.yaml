# ---------------------------------------------------------------------------
# Personal arXiv digest: edit this file to tune what you see.
# Changes take effect on the next scheduled run (or Actions -> Run workflow).
# ---------------------------------------------------------------------------

site_title: "Sam's arXiv Digest"
categories: [hep-ph, hep-ex, nucl-th, hep-th]
include_cross_lists: true        # e.g. astro-ph.HE papers cross-listed to hep-ph
include_replacements: false      # revised versions (v2, v3, ...) of older papers

# Which AI service to use:
#   gemini    -> Google Gemini API free tier (default). Needs repo secret GEMINI_API_KEY
#                from aistudio.google.com (free, no card). Note: on the free tier Google may
#                use prompts to improve its products; everything sent here is public arXiv text.
#   anthropic -> Claude (paid). Needs ANTHROPIC_API_KEY; use models auto-haiku / auto-sonnet.
provider: gemini

gemini:
  seconds_between_calls: 8       # stay under the free tier's requests-per-minute limit

ranking:
  model: auto-flash-lite         # scores every abstract (newest free Flash-Lite model)
  batch_size: 60                 # abstracts per request (fewer requests = safer on free tier)
  min_score: 4                   # papers below this go into the collapsed "everything else" list

summaries:
  model: auto-flash              # reads the full text of the top papers
  max_detailed: 10               # number of full summaries per day
  min_score: 6                   # only summarize papers at least this relevant
  papers_per_call: 5             # summarize several papers per request (free-tier friendly)
  full_text: true                # read the paper (arXiv HTML, else PDF) rather than only the abstract
  max_fulltext_chars: 40000      # ~11k tokens per paper

# Prose profile given to the model. The more specific, the better the ranking.
interests: |
  CORE (score highest):
  - Neutrino-nucleus interactions across energies: quasielastic, 2p2h/meson-exchange currents,
    resonance production, shallow- and deep-inelastic scattering, coherent pion production.
  - Neutrino event generators and their physics models: Achilles, GENIE, NuWro, GiBUU, NEUT,
    MARLEY; intranuclear cascades, final-state interactions, spectral functions, ab initio
    (GFMC, coupled cluster) electroweak responses, factorization schemes, nuclear remnants and
    de-excitation gammas/nucleons.
  - Low-energy (MeV) neutrino physics on argon and other nuclei: CEvNS, supernova neutrinos,
    DUNE low-energy program and supernova pointing, stopped-pion sources, nuclear de-excitation.
  - Electron scattering as a constraint on neutrino cross sections (e4nu, inclusive (e,e')).
  - Nucleon axial and vector form factors, z-expansion, lattice QCD inputs to neutrino physics.

  HIGH:
  - Effective field theories for low-energy precision physics: SMEFT/LEFT matching and running,
    neutrino non-standard interactions, nuclear and chiral EFT for electroweak processes,
    beta decay, CKM unitarity and radiative corrections.
  - Precision atomic and nuclear probes of new physics: isotope shifts and King-plot
    non-linearity, the thorium-229 nuclear clock, atomic clocks, variation of fundamental
    constants, ultralight scalar dark matter and new long-range forces.
  - BSM physics at neutrino experiments: neutrino tridents, upscattering, dipole portals, heavy
    neutral leptons, dark photons/scalars, light mediators; DUNE ND, SBN (SBND, MicroBooNE,
    ICARUS), MiniBooNE/LSND anomalies, FASER/FASERnu/FPF, SHiP, muon-collider neutrinos.
  - Parton showers, QCD resummation or hadronization applied to neutrino or lepton-nucleus
    scattering; eikonal/Glauber approximations.
  - Oscillation-analysis systematics driven by interaction modelling (DUNE, Hyper-K, T2K, NOvA).
  - Quantum entanglement, spin correlations and quantum tomography in scattering final states.

  MEDIUM:
  - Flavour physics with a low-energy or EFT angle (rare decays, lepton flavour violation,
    B/K/charm anomalies) when the idea is novel.
  - Nuclear structure relevant to the above (argon, carbon, oxygen), short-range correlations.
  - ML/AI and LLM agents for theoretical or phenomenological physics workflows.
  - General neutrino phenomenology (mass models, oscillations, cosmology) only when the idea is
    novel or the result is strong.

  LOW: string theory, holography, formal QFT, gravitational waves, heavy-ion/QGP physics,
  hadron spectroscopy, and collider BSM or flavour model-building without a low-energy,
  neutrino or precision angle.

